# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Keeps Kotlin compilation in the Gradle process. This avoids a stale Kotlin daemon
# appearing as a non-reporting background build in Android Studio.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# One production entry point for all generated API and universal-link endpoints.
aloPublicDomain=xn--80awj.online
# Debug builds use the Alo test VPS (HTTPS). Set to empty to use the Mac's local server instead.
aloDebugBaseUrl=https://test.xn--80awj.online/
# What release builds talk to. Now the same test VPS: api.<domain> still points to the old, dead server.
aloBaseUrl=https://test.xn--80awj.online/

# Firebase (Android push through FCM) is set in alo-local.properties next to this file: it is not in git.
# See alo-local.properties.example.
